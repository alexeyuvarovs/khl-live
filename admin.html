<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админ-панель · Live КХЛ</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0d1117; color: #e6edf3; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; }
  input, textarea, select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 15px; margin-bottom: 12px; font-family: inherit; }
  textarea { min-height: 80px; }
  button { width: 100%; padding: 14px; background: #238636; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:hover { background: #2ea043; }
  .status { font-size: 13px; text-align: center; margin-top: 8px; }
  .status.ok { color: #3fb950; }
  .status.err { color: #f85149; }
  #panel { display: none; }
</style>
</head>
<body>

<h1>🎙 Админ-панель</h1>

<div class="card" id="loginBox">
  <label>Пароль</label>
  <input type="password" id="pwd" placeholder="Введите пароль">
  <button onclick="doLogin()">Войти</button>
  <div class="status" id="loginStatus"></div>
</div>

<div id="panel">
  <div class="card">
    <label>ID матча (gameid)</label>
    <input type="number" id="gameid" placeholder="902177">

    <label>Период</label>
    <select id="period">
      <option value="1">1-й</option>
      <option value="2">2-й</option>
      <option value="3">3-й</option>
      <option value="4">Овертайм</option>
    </select>

    <label>Время (мм:сс)</label>
    <input type="text" id="tms" placeholder="30:15">

    <label>Сообщение</label>
    <textarea id="msg" placeholder="Что происходит в матче?"></textarea>

    <label><input type="checkbox" id="prio" style="width:auto;"> Важное сообщение (золотая полоска)</label>

    <button onclick="doSend()" id="sendBtn">▶ Отправить</button>
    <div class="status" id="sendStatus"></div>
  </div>
</div>

<script>
// ⚠️ ВСТАВЬ СВОЙ КЛЮЧ И ПАРОЛЬ
const SUPABASE = "https://xkjwomtycemjbmhjxnio.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrandvbXR5Y2VtamJtaGp4bmlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTk1NTAsImV4cCI6MjEwNzI5NTU1MH0.TqNPgvxf_NfOjv0kU8fwtf5hDegYisVZPjjvX1iAdSs";   // <--- ЗАМЕНИ НА СВОЙ КЛЮЧ (начинается на eyJ...)
const PASSWORD = "khl2026";         // <--- Пароль для входа

function doLogin() {
  const pwd = document.getElementById("pwd").value;
  const status = document.getElementById("loginStatus");

  if (pwd === PASSWORD) {
    status.textContent = "✅ Вход выполнен";
    status.className = "status ok";
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    loadLastMatch();
  } else {
    status.textContent = "❌ Неверный пароль";
    status.className = "status err";
  }
}

async function loadLastMatch() {
  const status = document.getElementById("sendStatus");
  try {
    const r = await fetch(SUPABASE + "/rest/v1/matches?select=gameid,home,visitor&order=date.desc,gameid.desc&limit=1", {
      headers: { "apikey": KEY, "Authorization": "Bearer " + KEY }
    });
    const data = await r.json();
    if (data && data[0]) {
      document.getElementById("gameid").value = data[0].gameid;
      status.textContent = "Текущий матч: " + data[0].home + " — " + data[0].visitor;
      status.className = "status ok";
      status.style.fontWeight = "bold";
      status.style.fontSize = "15px";
      status.style.marginBottom = "15px";
    }
  } catch (e) {
    status.textContent = "Ошибка загрузки матча: " + e.message;
    status.className = "status err";
  }
}

async function doSend() {
  const btn = document.getElementById("sendBtn");
  const status = document.getElementById("sendStatus");

  const gid = document.getElementById("gameid").value;
  const per = document.getElementById("period").value;
  const tms = document.getElementById("tms").value;
  const msg = document.getElementById("msg").value.trim();
  const prio = document.getElementById("prio").checked;

  if (!gid || !msg) {
    status.textContent = "Заполни ID матча и сообщение";
    status.className = "status err";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Отправка...";

  try {
    const r = await fetch(SUPABASE + "/rest/v1/commentary", {
      method: "POST",
      headers: {
        "apikey": KEY,
        "Authorization": "Bearer " + KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        gameid: Number(gid),
        period: Number(per),
        time_ms: tms,
        text: msg,
        priority: prio ? 1 : 0
      })
    });

    if (!r.ok) throw new Error("Ошибка сервера " + r.status);

    status.textContent = "✅ Отправлено в эфир!";
    status.className = "status ok";
    document.getElementById("msg").value = "";
    document.getElementById("prio").checked = false;
  } catch (e) {
    status.textContent = "Ошибка: " + e.message;
    status.className = "status err";
  }

  btn.disabled = false;
  btn.textContent = "▶ Отправить";
}
</script>
</body>
</html>
